<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - 业务管理系统</title>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/pagination.css" />
  <link rel="stylesheet" href="../assets/css/users.css" />
</head>
<body data-page="users">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-brand">
        <div class="brand-mark">业</div>
        <div class="brand-copy"><strong>业务管理系统</strong><span>Business Management</span></div>
      </div>
      <nav class="app-menu" id="appMenu" aria-label="主菜单"></nav>
      <div class="sidebar-scope"><span>系统管理</span><strong>统一维护账号与功能权限</strong></div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="icon-only-btn" id="sidebarToggle" aria-label="收起侧边菜单" title="收起或展开侧边菜单">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="topbar-title"><strong>用户管理</strong><span>系统账号、组织与角色维护</span></div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="user-trigger" aria-expanded="false">
            <div class="avatar">张</div>
            <div class="user-copy"><strong>张明</strong><span>业务组长</span></div>
            <span class="chevron"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </button>
        </div>
      </header>

      <section class="app-content um-page">
        <div class="um-head">
          <h1>用户管理</h1>
          <p>维护用户账号、组织归属、角色绑定和启停状态。</p>
        </div>

        <div class="um-layout">
          <aside class="um-sidebar">
            <div class="um-side-head">
              <h3>组织架构</h3>
            </div>
            <div class="um-side-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="umOrgSearch" type="text" placeholder="搜索组织" />
            </div>
            <div class="um-side-tip">右键组织可新增、重命名、删除。</div>
            <div class="um-tree" id="umOrgTree"></div>
          </aside>

          <section class="um-main">
            <div class="um-card">
              <div class="um-toolbar">
                <div class="um-actions">
                  <button type="button" class="primary-btn" data-act="create">新增</button>
                  <button type="button" class="secondary-btn" data-act="import">导入</button>
                  <button type="button" class="secondary-btn" data-act="export">导出</button>
                  <button type="button" class="danger-btn subtle" data-act="batch-delete">删除</button>
                </div>
                <div class="um-filter">
                  <select id="umStatusFilter">
                    <option value="">全部状态</option>
                    <option value="normal">正常</option>
                    <option value="disabled">已禁用</option>
                  </select>
                  <input id="umAccountFilter" type="text" placeholder="账号" />
                  <input id="umNameFilter" type="text" placeholder="姓名" />
                  <select id="umRoleFilter">
                    <option value="">全部角色</option>
                    <option value="业务分析师">业务分析师</option>
                    <option value="运营管理员">运营管理员</option>
                    <option value="系统管理员">系统管理员</option>
                  </select>
                  <button type="button" class="ghost-btn" data-act="reset-filter">重置</button>
                  <button type="button" class="primary-btn" data-act="search">查询</button>
                </div>
              </div>

              <div class="um-table-wrap">
                <table class="um-table">
                  <thead>
                    <tr>
                      <th style="width:44px;"><input id="umCheckAll" type="checkbox" /></th>
                      <th style="width:11%;">账号</th>
                      <th style="width:8%;">姓名</th>
                      <th style="width:13%;">所属部门</th>
                      <th style="width:11%;">手机号码</th>
                      <th style="width:17%;">邮箱</th>
                      <th style="width:8%;">状态</th>
                      <th style="width:10%;">角色</th>
                      <th style="width:22%;">操作</th>
                    </tr>
                  </thead>
                  <tbody id="umTbody"></tbody>
                </table>
              </div>
              <div class="app-pagination hidden" id="umPager" aria-label="用户列表分页"></div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="um-drawer-mask hidden" id="umDrawerMask"></div>
  <aside class="um-drawer hidden" id="umDrawer" aria-hidden="true">
    <header class="um-drawer-head">
      <div>
        <h3 id="umDrawerTitle">用户详情</h3>
        <p id="umDrawerSubtitle">查看与维护用户信息</p>
      </div>
      <button type="button" class="um-drawer-close" data-act="close-drawer" aria-label="关闭">×</button>
    </header>
    <div class="um-drawer-body" id="umDrawerBody"></div>
    <footer class="um-drawer-foot" id="umDrawerFoot"></footer>
  </aside>

  <div class="um-ctxmenu hidden" id="umOrgCtxMenu">
    <button type="button" class="um-ctx-item" data-act="org-new">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      新增子组织
    </button>
    <button type="button" class="um-ctx-item" data-act="org-rename">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      重命名
    </button>
    <div class="um-ctx-sep"></div>
    <button type="button" class="um-ctx-item is-danger" data-act="org-delete">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      删除组织
    </button>
  </div>

  <div class="modal small hidden" id="umConfirmModal" role="dialog" aria-modal="true" aria-labelledby="umConfirmTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h3 id="umConfirmTitle">操作确认</h3>
        <button class="modal-close" type="button" id="umConfirmClose">×</button>
      </div>
      <div class="modal-body">
        <p id="umConfirmText">确定执行该操作吗？</p>
      </div>
      <div class="modal-foot">
        <button class="secondary-btn" type="button" id="umConfirmCancel">取消</button>
        <button class="primary-btn" type="button" id="umConfirmOk">确定</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/pagination.js"></script>
  <script src="../assets/js/users.js"></script>
</body>
</html>
