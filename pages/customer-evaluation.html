<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户评价 - 业务管理系统</title>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/dashboard-controls.css" />
  <link rel="stylesheet" href="../assets/css/customer-evaluation.css" />
</head>
<body data-page="customer-evaluation">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-brand">
        <div class="brand-mark">业</div>
        <div class="brand-copy">
          <strong>业务管理系统</strong>
          <span>Business Management</span>
        </div>
      </div>
      <nav class="app-menu" id="appMenu" aria-label="主菜单"></nav>
      <div class="sidebar-scope">
        <span>当前页面范围</span>
        <strong>评价回收分析 · 润汇采数据</strong>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="icon-only-btn" id="sidebarToggle" aria-label="收起侧边菜单" title="收起或展开侧边菜单">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="topbar-title">
            <strong>客户评价</strong>
            <span id="topbarPageSubtitle">部门负责人 · 部门评价视图</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="user-trigger" aria-expanded="false">
            <div class="avatar" id="ceUserAvatar">陈</div>
            <div class="user-copy"><strong id="ceUserName">陈建</strong><span id="ceUserRole">部门负责人</span></div>
            <span class="chevron"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </button>
        </div>
      </header>

      <section class="app-content">
        <div class="ce-page">
          <header class="page-header ce-page-header">
            <div class="page-title">
              <div class="breadcrumb" id="ceBreadcrumb" aria-label="当前位置"></div>
              <h1 id="cePageTitle">部门客户评价看板</h1>
              <p id="cePageDescription">从部门整体查看各业务组的客户评价表现，并逐级下钻至业务组和个人。</p>
            </div>
            <div class="page-actions ce-page-actions" id="cePageActions"></div>
          </header>

          <section class="panel dashboard-control-panel ce-filter-panel" aria-label="角色身份与评价统计条件">
            <div class="dashboard-role-row">
              <div class="dashboard-control-copy">
                <span class="field-label">角色身份</span>
                <p id="ceRoleHint">正式系统按登录人权限自动进入对应层级，以下切换仅用于原型演示。</p>
              </div>
              <div class="dashboard-role-tabs" id="ceRoleTabs" aria-label="切换角色身份"></div>
            </div>
            <div class="dashboard-filter-row">
              <div class="dashboard-control-copy">
                <span class="field-label">统计周期</span>
                <p id="ceScopeHint">当前查看代理业务部在所选统计周期的客户评价数据。</p>
              </div>
              <div class="dashboard-extra-filters ce-extra-filters">
                <div class="dashboard-period-controls">
                  <div class="dashboard-period-tabs" id="cePeriodTypeTabs" aria-label="切换评价统计周期">
                    <button type="button" class="dashboard-period-tab active" data-period-type="月度" aria-pressed="true">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                      月度
                    </button>
                    <button type="button" class="dashboard-period-tab" data-period-type="季度" aria-pressed="false">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9M12 12 6 18"/></svg>
                      季度
                    </button>
                  </div>
                  <label class="dashboard-period-value">
                    <span class="sr-only">选择评价统计周期</span>
                    <select class="form-select" id="cePeriodValueSelect" aria-label="选择评价统计周期"></select>
                  </label>
                </div>
                <label class="dashboard-filter-field dashboard-inline-filter ce-inline-filter">
                  <span class="field-label">业务类型</span>
                  <select class="form-select" id="ceBusinessFilter" aria-label="选择业务类型">
                    <option value="全部">全部业务类型</option>
                    <option value="招标代理">招标代理</option>
                    <option value="造价咨询">造价咨询</option>
                  </select>
                </label>
                <label class="dashboard-filter-field dashboard-inline-filter ce-inline-filter">
                  <span class="field-label">评分分类</span>
                  <select class="form-select" id="ceRatingFilter" aria-label="选择评分分类">
                    <option value="全部">全部评分</option>
                    <option value="优秀">优秀（9—10分）</option>
                    <option value="良好">良好（8—8.9分）</option>
                    <option value="一般">一般（6—7.9分）</option>
                    <option value="低分">低分（6分以下）</option>
                  </select>
                </label>
              </div>
            </div>
          </section>

          <div id="ceContent" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="drawer-mask hidden" id="ceDrawerMask"></div>
  <aside class="drawer hidden ce-detail-drawer" id="ceDetailDrawer" role="dialog" aria-modal="true" aria-labelledby="ceDrawerTitle">
    <div class="drawer-head">
      <div>
        <h2 id="ceDrawerTitle">评价详情</h2>
        <p id="ceDrawerSubtitle"></p>
      </div>
      <button type="button" class="icon-only-btn" id="ceDrawerClose" aria-label="关闭评价详情">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="ceDrawerBody"></div>
    <div class="drawer-foot">
      <button type="button" class="ghost-btn" id="ceDrawerCloseButton">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        关闭
      </button>
    </div>
  </aside>

  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/customer-evaluation.js"></script>
</body>
</html>
