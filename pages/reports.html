<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>报表报告 - 业务管理系统</title>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/dashboard-controls.css" />
  <link rel="stylesheet" href="../assets/css/reports.css" />
  <link rel="stylesheet" href="../assets/css/reports-controls.css" />
</head>
<body data-page="reports">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-brand"><div class="brand-mark">业</div><div class="brand-copy"><strong>业务管理系统</strong><span>Business Management</span></div></div>
      <nav class="app-menu" id="appMenu" aria-label="主菜单"></nav>
      <div class="sidebar-scope"><span>当前查看范围</span><strong>经营数据 · 三级穿透</strong></div>
    </aside>
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="icon-only-btn" id="sidebarToggle" aria-label="收起侧边菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="topbar-title"><strong id="topbarPageTitle">报表报告</strong><span id="topbarPageSubtitle">部门负责人 · 部门报表视图</span></div>
        </div>
        <div class="topbar-actions"><button type="button" class="user-trigger" aria-expanded="false"><div class="avatar" id="reportUserAvatar">陈</div><div class="user-copy"><strong id="reportUserName">陈建</strong><span id="reportUserRole">部门负责人</span></div><span class="chevron"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button></div>
      </header>
      <section class="app-content reports-page">
        <div class="page-header">
          <div class="page-title">
            <div class="breadcrumb"><span>经营管理</span><span>/</span><span class="current">报表报告</span></div>
            <h1 id="reportPageTitle">部门经营报表</h1>
            <p id="reportPageDescription">查看部门及各业务组指标，支持组织穿透、同比环比分析和报告输出。</p>
          </div>
          <div class="page-actions">
            <div class="report-data-badge"><span>统计周期</span><strong id="reportPeriodBadge">2026年7月</strong></div>
            <button type="button" class="secondary-btn" id="exportDataButton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>导出数据</button>
            <button type="button" class="primary-btn" id="generateReportButton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg>生成报告</button>
          </div>
        </div>

        <section class="panel dashboard-control-panel" aria-label="演示身份与统计条件">
          <div class="dashboard-role-row">
            <div class="dashboard-control-copy">
              <span class="field-label">演示身份</span>
              <p>原型按身份切换部门、业务组和个人的可查看范围。</p>
            </div>
            <div class="dashboard-role-tabs" id="reportRoleTabs" aria-label="切换演示身份"></div>
          </div>
          <div class="dashboard-filter-row">
            <div class="dashboard-control-copy">
              <span class="field-label">统计周期</span>
              <p>月度与季度经营数据分开统计，报表内容按所选周期生成。</p>
            </div>
            <div class="dashboard-extra-filters">
              <div class="dashboard-period-controls">
                <div class="dashboard-period-tabs" id="reportPeriodTypeTabs" aria-label="切换统计周期模式">
                  <button type="button" class="dashboard-period-tab active" data-period-type="月度" aria-pressed="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                    月度
                  </button>
                  <button type="button" class="dashboard-period-tab" data-period-type="季度" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9M12 12 6 18"/></svg>
                    季度
                  </button>
                </div>
                <label class="dashboard-period-value">
                  <span class="sr-only">选择统计周期</span>
                  <select class="form-select" id="reportPeriodSelect" aria-label="选择统计周期"></select>
                </label>
              </div>
              <label class="dashboard-filter-field dashboard-inline-filter report-business-filter">
                <span class="field-label">业务类型</span>
                <select class="form-select" id="reportBusinessTypeSelect" aria-label="选择业务类型"></select>
              </label>
            </div>
          </div>
        </section>

        <div class="report-level-path" id="reportLevelPath"></div>
        <section class="report-summary-grid" id="reportSummaryGrid"></section>

        <section class="panel report-section" id="organizationPanel">
          <div class="panel-head"><div><h2 id="organizationPanelTitle">业务组指标对比</h2><p id="organizationPanelDescription">点击业务组名称进入本组报表</p></div><span class="status-tag pending" id="organizationCount"></span></div>
          <div class="report-table-wrap"><table class="report-table organization-table"><thead id="organizationTableHead"></thead><tbody id="organizationTableBody"></tbody></table></div>
        </section>

        <section class="panel report-section">
          <div class="report-section-toolbar">
            <div><h2>指标明细报表</h2><p>展开指标查看基础组成数据，查看明细可穿透到项目或标段记录。</p></div>
            <div class="metric-tabs" id="metricCategoryTabs"></div>
          </div>
          <div class="report-table-wrap"><table class="report-table metric-report-table"><thead><tr><th class="sticky-name">指标名称</th><th>当前区间值</th><th>上期值</th><th class="mom-col">环比</th><th>同期值</th><th class="yoy-col">同比</th><th>年度目标</th><th>年度累计</th><th>完成进度</th><th class="sticky-action">操作</th></tr></thead><tbody id="metricReportBody"></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div id="reportOverlayRoot"></div>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/reports.js"></script>
</body>
</html>
