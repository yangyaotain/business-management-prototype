<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据报告 - 业务管理系统</title>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/dashboard-controls.css" />
  <link rel="stylesheet" href="../assets/css/pagination.css" />
  <link rel="stylesheet" href="../assets/css/reports.css" />
  <link rel="stylesheet" href="../assets/css/reports-controls.css" />
</head>
<body data-page="report-documents">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-brand"><div class="brand-mark">业</div><div class="brand-copy"><strong>业务管理系统</strong><span>Business Management</span></div></div>
      <nav class="app-menu" id="appMenu" aria-label="主菜单"></nav>
      <div class="sidebar-scope"><span>当前查看范围</span><strong>报告归档 · 近一年</strong></div>
    </aside>
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="icon-only-btn" id="sidebarToggle" aria-label="收起侧边菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="topbar-title"><strong id="topbarPageTitle">数据报告</strong><span id="topbarPageSubtitle">部门负责人 · 报告归档视图</span></div>
        </div>
        <div class="topbar-actions"><button type="button" class="user-trigger" aria-expanded="false"><div class="avatar" id="reportDocumentUserAvatar">陈</div><div class="user-copy"><strong id="reportDocumentUserName">陈建</strong><span id="reportDocumentUserRole">部门负责人</span></div><span class="chevron"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button></div>
      </header>
      <section class="app-content reports-page">
        <div class="page-header">
          <div class="page-title">
            <div class="breadcrumb"><span>经营管理</span><span>/</span><span class="current">数据报告</span></div>
            <h1>数据报告</h1>
            <p>查看、预览和导出当前权限范围内近一年的月度报告和季度报告。</p>
          </div>
        </div>

        <section class="panel dashboard-control-panel report-document-mode" aria-label="角色身份">
          <div class="dashboard-role-row">
            <div class="dashboard-control-copy">
              <span class="field-label">角色身份</span>
              <p>原型按身份切换部门、业务组和个人可查看的数据报告范围。</p>
            </div>
            <div class="dashboard-role-tabs" id="reportDocumentRoleTabs" aria-label="切换角色身份"></div>
          </div>
        </section>

        <section class="panel report-section report-document-panel">
          <div class="report-section-toolbar report-document-head">
            <div>
              <h2 id="reportDocumentTitle">月度报告</h2>
              <p id="reportDocumentDescription">查看近12个月权限范围内的月度报告。</p>
            </div>
            <span class="dashboard-organization-count" id="managedReportCount" aria-live="polite"></span>
          </div>
          <div class="report-management-body">
            <div class="report-document-controls">
              <div class="report-document-type-tabs" id="reportDocumentTypeTabs" role="tablist" aria-label="切换月度报告和季度报告">
                <button type="button" class="report-document-type-tab active" id="monthlyReportTab" role="tab" aria-selected="true" aria-controls="managedReportList" data-report-type="月度">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                  月度报告
                  <em>12</em>
                </button>
                <button type="button" class="report-document-type-tab" id="quarterlyReportTab" role="tab" aria-selected="false" aria-controls="managedReportList" data-report-type="季度" tabindex="-1">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9M12 12 6 18"/></svg>
                  季度报告
                  <em>4</em>
                </button>
              </div>
              <div class="report-management-toolbar">
                <label class="report-management-search">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                  <input id="reportManagementSearch" type="search" placeholder="搜索月度报告名称、月份或范围" aria-label="搜索月度报告名称、月份或范围" autocomplete="off" />
                </label>
                <button type="button" class="secondary-btn" id="reportManagementSearchButton">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                  查询
                </button>
              </div>
            </div>
            <div id="managedReportList" role="tabpanel" aria-labelledby="monthlyReportTab">
              <div class="report-table-wrap">
                <table class="report-table managed-report-table">
                  <thead id="managedReportTableHead"></thead>
                  <tbody id="managedReportTableBody"></tbody>
                </table>
              </div>
              <div class="app-pagination hidden" id="managedReportPagination" aria-label="数据报告分页"></div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/pagination.js"></script>
  <script src="../assets/js/report-documents.js"></script>
</body>
</html>
